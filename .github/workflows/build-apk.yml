name: Build APK (Planner20k)
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { lfs: false }

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { cache-write-only: ${{ github.ref == 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          CI: true
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties || true
          ./gradlew :app:assembleDebug --console=plain --no-daemon --build-cache 2>&1 | tail -80

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepcoder-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
