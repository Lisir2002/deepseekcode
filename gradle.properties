org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2

# ===== Phase 4 内存收敛（用户：一个任务一个来，不要并行）========
# Gradle/JVM 主堆 2048m（之前 1024/1536 给 Kotlin Compiler 留空间不够，导致进程 WAITING）
# free=4.9G，2G=40% 安全。Metaspace 512m + Direct 256m 防 Native OOM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:MaxDirectMemorySize=256m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# 一次只构建一个
org.gradle.parallel=false
org.gradle.workers.max=1

# Gradle 构建缓存 + Kotlin 增量编译（用户：支持增量编译，不要每次从头来）
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.incremental=true
kotlin.caching.enabled=true

# 【关键】不写 kotlin.compiler.execution.strategy / kotlin.daemon.jvm.options 覆盖
# 让 Kotlin Gradle Plugin 走默认 daemon 模式 + 默认 JVM 参数（之前写这些 = 引入冲突，
# 表现为 KotlinCompileDaemon=0 进程根本不 fork，或 41 线程全 WAITING，编译 9min 不推进）

# AAPT2 单进程（Android 部分）
android.aapt2Options.server.maxProcCount=1

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
