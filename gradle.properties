org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2

# ===== Phase 4 内存收敛（用户：一个任务一个来，不要并行）========
# DEVIATE P4-S1A-gradle-config | reason: 默认 Kotlin daemon 模式在本环境中导致 41 线程 futex_wait 死锁，编译 9min 无进展(.class=0) | risk: 堆内存占用更高，单编场景仍在 4.8G 可用内可控 | resume: 冷启动编译通过后 P4-S2/S3 复用缓存走增量即可
# Gradle/JVM 主堆 2560m(原2048↑) + Metaspace 768m(原512↑)，避免 Kotlin 2.0 + serialization 插件类加载期 GC thrashing → 死锁
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:MaxDirectMemorySize=256m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# 一次只构建一个
org.gradle.parallel=false
org.gradle.workers.max=1

# Gradle 构建缓存 + Kotlin 增量编译（用户：支持增量编译，不要每次从头来）
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.incremental=true
kotlin.caching.enabled=true

# 【关键·修复 P4-S1A Hang】kotlin.compiler.execution.strategy=in-process
# 让 Kotlin 编译器直接在 Gradle Daemon JVM 内运行，不 fork KotlinCompileDaemon。
# 代价：启动速度略慢；收益：彻底避免「Gradle Daemon ↔ KotlinCompileDaemon」双进程 futex WAIT 死锁
# （之前写 kotlin.daemon.jvm.options 覆盖 = 触发该死锁，表现为 41 线程 WAITING、9min .class=0）
kotlin.compiler.execution.strategy=in-process

# AAPT2 单进程（Android 部分）
android.aapt2Options.server.maxProcCount=1

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# ===== Sandbox proxy (CI env requires HTTP_PROXY=127.0.0.1:18080) =====
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
